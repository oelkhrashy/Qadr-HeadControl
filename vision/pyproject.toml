[project]
name = "qadr-vision-worker"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mediapipe==0.10.21",
  "numpy==1.26.4",
  "opencv-contrib-python==4.11.0.86",
  "matplotlib>=3.10,<4",
  "vosk==0.3.45",
  "sounddevice>=0.5,<0.6",
  "pyinstaller>=6.16,<7",
]

[tool.uv]
package = false
# JAX is optional in the Tasks API used here. Exclude unused JIT runtimes.
override-dependencies = ["jax; sys_platform != 'win32'", "jaxlib; sys_platform != 'win32'", "srt; sys_platform != 'win32'"]
